<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BOSS 消息助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <label>唤醒消息模板<textarea id="wakeTemplate" placeholder="由你填写；用于当前会话草稿验证"></textarea></label>
      <label>已读未回模板<textarea id="followUpTemplate" placeholder="由你填写；会长期保存"></textarea></label>
      <header><h1>BOSS 消息助手</h1><p>仅在 BOSS 直聘消息页可用</p></header>
      <section class="exclusions">
        <div><strong>长期排除名单</strong><span id="exclusionCount">0 位面试官</span></div>
        <button id="addCurrentButton" class="outline">排除当前面试官</button>
      </section>
      <ul id="exclusionList"></ul>
      <section class="actions">
        <button id="wakeAllButton" class="primary">一键唤醒全部面试官</button>
        <button id="followUpButton" class="secondary">跟进已读未回面试官</button>
        <button id="stopButton" class="stop" hidden>停止当前任务</button>
        <button id="sendCurrentButton" class="primary">发送当前会话测试消息</button>
        <button id="draftButton" class="test">写入当前会话草稿（不发送）</button>
        <button id="replaceDraftButton" class="diagnose">替换当前草稿（不发送）</button>
        <button id="previewButton" class="test">验证前三个会话切换（不发送）</button>
        <button id="messageAuditButton" class="diagnose">审计当前会话消息状态（不发送）</button>
        <button id="collectionScanButton" class="diagnose">扫描全部会话数量（不发送）</button>
        <button id="auditButton" class="diagnose">运行页面审计（不发送）</button>
        <button id="copyAuditButton" class="test" disabled>复制审计结果</button>
      </section>
      <p id="status" class="status" role="status">安全审计模式：发送功能已完全关闭。</p>
      <textarea id="auditOutput" aria-label="审计结果" readonly placeholder="点击“运行页面审计”后，结果会显示在这里。"></textarea>
      <p class="notice">发送和批量任务只在你点击相应按钮后执行；请遵守网站规则和页面提示。</p>
    </main>
    <script src="shared.js"></script>
    <script src="popup-controls.js"></script>
  </body>
</html>
